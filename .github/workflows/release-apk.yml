name: Release APK

# Builds an Android APK on EAS and attaches it to an existing GitHub release.
#
# Called by release-please.yml the moment it publishes a release, and runnable by
# hand from the Actions tab to (re)attach an APK to any tag that already has one.
#
# One secret is required — EXPO_TOKEN, from expo.dev → Settings → Access tokens.
# The signing keystore is generated and held by EAS (`eas credentials`), so no
# keystore material lives in this repository or in GitHub secrets. Moving the
# build onto the runner later is what would add the keystore set.
#
# The project must also be linked to EAS, by an `extra.eas.projectId` in the app
# config — without it `eas build` cannot run non-interactively, nor resolve the
# remote versionCode that eas.json asks for. `eas init` cannot write that field
# into app.config.js, because it is a script rather than a static app.json, so
# the ID is set by hand: either as the fallback in app.config.js or as the
# EAS_PROJECT_ID repository variable read below.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to build from and attach the APK to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      # release-please prefixes its tags with the component name, so they read
      # `values-v0.3.0` and not `v0.3.0`. Spelling the prefix out here is not
      # pedantry: the shorter form was typed once, and `actions/checkout` failed
      # on it with a bare "git failed with exit code 1" that names neither the
      # ref it wanted nor the fact that it was the input that was wrong.
      tag:
        description: Tag of an existing release, e.g. values-v0.3.0
        required: true
        type: string

# Uploading a release asset is the only write this needs.
permissions:
  contents: write

# Two runs for the same tag would race on the same asset name.
concurrency:
  group: release-apk-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK and attach to release
    runs-on: ubuntu-latest
    # An EAS build queues before it compiles, and on the free tier the queue is
    # most of the wall clock: the first release build sat in it for the whole of
    # a 60-minute timeout without starting, and the job was killed still waiting
    # on a build that EAS went on to run anyway. Three hours is sized for that
    # queue rather than for the compile. The idle runner is close to free — this
    # repository is public, so GitHub-hosted minutes are not billed — and half
    # the 6h default still bounds a release that EAS never answers.
    timeout-minutes: 180
    # A project ID is not a secret — it ships inside every build — so it is a
    # repository variable, and empty when app.config.js carries the ID itself.
    # Set at the job level because both the check below and eas-cli read it.
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The `secrets` context cannot be read from an `if:`, so a missing token
      # has to be caught in a step body. Failing here, before the EAS setup, is
      # what turns "eas whoami: not logged in" into an actionable message.
      - name: Fail early without EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN is not set. Create one at https://expo.dev/settings/access-tokens and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Unlinked, eas-cli fails 40 minutes of setup later with "EAS project not
      # configured", a message that names neither the field it wants nor the
      # reason `eas init` could not write it. app.config.js is a plain module
      # that imports nothing, so the resolved ID can be read before `bun install`
      # — and reading it, rather than the variable, keeps a hardcoded ID valid.
      - name: Fail early without a linked EAS project
        run: |
          id="$(node -e 'process.stdout.write(require("./app.config.js").expo.extra?.eas?.projectId ?? "")')"
          if [ -z "${id}" ]; then
            echo "::error::No EAS project ID. Run 'eas init' once locally: it creates the project and prints the ID, then exits without writing it, because app.config.js is a dynamic config. Store that ID as the EAS_PROJECT_ID repository variable under Settings → Secrets and variables → Actions → Variables, or paste it into app.config.js as the EAS_PROJECT_ID fallback."
            exit 1
          fi
          echo "Building EAS project ${id}."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The compile happens on EAS, but eas-cli evaluates app.config.js through
      # the project's own @expo/config, so the dependencies still have to be here.
      - name: Install dependencies
        run: bun install

      - name: Build the APK on EAS
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # `--output` applies to `--local` builds only, so the artifact URL is
        # read back out of the JSON. `--json` implies `--non-interactive` and
        # keeps everything that is not JSON on stderr.
        run: |
          eas build --platform android --profile release --json --wait > build.json
          url="$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl // empty' build.json)"
          if [ -z "${url}" ]; then
            echo "::error::EAS reported no application archive for this build."
            cat build.json
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Download the APK
        env:
          APK_URL: ${{ steps.build.outputs.url }}
          TAG: ${{ inputs.tag }}
        run: curl -fsSL --retry 3 -o "values-${TAG}.apk" "${APK_URL}"

      # The in-app updater hashes what it downloaded and compares it against
      # this file, so a transfer that was truncated or interrupted is discarded
      # instead of being handed to the Android installer — which rejects it much
      # later, with "There's a problem with the app file" and no way to tell that
      # from a broken build. `sha256sum` output is the format the app parses;
      # `basename` keeps the runner's directory out of the recorded name.
      - name: Checksum the APK
        env:
          TAG: ${{ inputs.tag }}
        run: sha256sum "values-${TAG}.apk" > "values-${TAG}.apk.sha256"

      - name: Attach the APK and its checksum to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        # --clobber so a manual re-run replaces the assets rather than failing on
        # names that are already taken. Both go up in one call: the app looks for
        # `<apk>.sha256` beside the APK, and a release carrying only half the pair
        # falls back to a weaker check for no reason.
        run: |
          gh release upload "${TAG}" \
            "values-${TAG}.apk" \
            "values-${TAG}.apk.sha256" \
            --clobber
