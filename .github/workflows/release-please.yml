name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    # The `secrets` context is not available in a step-level `if:`, but it is in
    # a job-level `env:` — so the "do we have a PAT?" test is resolved here and
    # read back as a plain string below.
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Falls back to the default token when RELEASE_TOKEN is not set. The
          # difference matters for the auto-merge step below, which a
          # GITHUB_TOKEN-authored PR cannot trigger — so that step is skipped
          # rather than failing when the PAT is absent.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # release-please pushes its release branch before it opens the pull
      # request, so the two halves fail apart: the branch lands, the PR is
      # refused, and the raw error names neither the setting that refuses it nor
      # the fact that a re-run resumes cleanly. Say both.
      - name: Explain a refused release PR
        if: ${{ failure() && steps.release-please.outcome == 'failure' }}
        run: |
          echo "::error title=Release PR was not opened::GitHub refuses pull request creation by the default GITHUB_TOKEN until Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests' is enabled. Enable it, or add a RELEASE_TOKEN secret (a PAT with repo scope), then re-run this workflow — the release branch is already pushed, so a re-run only has to open the PR."

      - name: Enable auto-merge for the release PR
        if: ${{ steps.release-please.outputs.pr && env.HAS_RELEASE_TOKEN == 'true' }}
        run: gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ fromJSON(steps.release-please.outputs.pr || '{"number":0}').number }}

  # Attached from inside this workflow rather than from `on: release`, because a
  # release created with the default GITHUB_TOKEN raises no event that can start
  # another workflow — the APK would simply never be built.
  android-apk:
    name: Android APK
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-apk.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # EXPO_TOKEN; the called workflow narrows the permissions it actually uses.
    secrets: inherit
