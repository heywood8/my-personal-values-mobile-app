name: CI

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Code Quality - Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        id: lint
        # lint:ci passes --max-warnings 0, so ESLint exits non-zero on any warning
        # as well as any error. continue-on-error lets the results comment post
        # before the job is failed by the final step. pipefail keeps ESLint's exit
        # code from being masked by tee.
        run: |
          set -o pipefail
          bun run lint:ci 2>&1 | tee lint-output.txt
        continue-on-error: true

      - name: Post lint results
        if: always()
        uses: actions/github-script@v8
        id: set-lint-results
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let output = fs.readFileSync('lint-output.txt', 'utf8');

            // strip ANSI escape codes
            output = output.replace(/\u001b\[[0-9;]*m/g, '');

            // Read the counts off ESLint's own summary line rather than tallying
            // every "N error" in the report: each finding is prefixed with
            // "line:column", so a match sweep sums line numbers into the total and
            // reports "2 errors, 6 warnings" for one of each.
            const summary = output.match(/✖\s+\d+\s+problems?\s+\((\d+)\s+errors?,\s+(\d+)\s+warnings?\)/);
            const errorCount = summary ? parseInt(summary[1], 10) : 0;
            const warningCount = summary ? parseInt(summary[2], 10) : 0;

            const problems = output.match(/[\s\S]*?(?=\n✖|$)/);
            const problemDetails = problems ? problems[0].trim() : '';

            // ESLint prints that summary only once it has actually linted. A bad
            // config, or a plugin that does not support the installed ESLint,
            // exits 2 with a bare stack trace and no summary at all — which reads
            // as zero problems, so a red job used to carry a green comment. The
            // step outcome is what separates the two.
            const crashed = !summary && process.env.LINT_OUTCOME !== 'success';

            let comment = '## Lint Results\n\n';

            if (crashed) {
              comment += '💥 **ESLint failed to run**\n\n';
              comment += 'No files were linted — this is a tooling failure, not a code problem.\n\n';

              if (problemDetails) {
                comment += '<details>\n<summary>Details</summary>\n\n```\n' + problemDetails + '\n```\n</details>\n';
              }
            } else if (errorCount === 0 && warningCount === 0) {
              comment += '✅ **No linting issues found!**\n\n';
              comment += 'All code passed ESLint checks.\n';
            } else {
              comment += `⚠️ **Found ${errorCount} error(s) and ${warningCount} warning(s)**\n\n`;

              if (problemDetails) {
                comment += '<details>\n<summary>Details</summary>\n\n```\n' + problemDetails + '\n```\n</details>\n';
              }
            }

            core.setOutput('message', comment);

      - uses: marocchino/sticky-pull-request-comment@v3
        if: always()
        with:
          header: "Lint Results"
          message: ${{ steps.set-lint-results.outputs.message }}
          hide_and_recreate: true
          hide_classify: "OUTDATED"

      - name: Fail if linting problems found
        if: steps.lint.outcome != 'success'
        run: exit 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests
        id: test
        run: |
          set -o pipefail
          bun run test -- --coverage 2>&1 | tee test-output.txt
        continue-on-error: true

      - name: Post test results
        if: always()
        uses: actions/github-script@v8
        id: set-results
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let output = fs.readFileSync('test-output.txt', 'utf8');

            output = output.replace(/\u001b\[[0-9;]*m/g, '');

            const summaryMatch = output.match(/(Test Suites:.*\nTests:.*\nSnapshots:.*\nTime:.*(?:\nRan all test suites\.)?)/);
            const summary = summaryMatch ? summaryMatch[0] : '';

            const coverageMatch = output.match(/File\s+\|[^\n]*\n-+\|[^\n]*\n([\s\S]*?)(?=\nTest Suites:|$)/);
            const coverage = coverageMatch ? 'File' + coverageMatch[0].substring(4) : '';

            const failMatches = output.match(/FAIL[^\n]*\n([\s\S]*?)(?=\nPASS|\nTest Suites:|$)/g);
            const errors = failMatches ? failMatches.join('\n\n') : '';

            let overallCoverage = '';
            try {
              const coverageSummary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverageSummary.total;
              overallCoverage = `| Statements | Branches | Functions | Lines |\n` +
                               `|:----------:|:--------:|:---------:|:-----:|\n` +
                               `| ${total.statements.pct}% | ${total.branches.pct}% | ${total.functions.pct}% | ${total.lines.pct}% |`;
            } catch (e) {
              // coverage summary not available
            }

            let comment = '## Test Results\n\n';

            if (summary) {
              comment += '### Summary\n\n```\n' + summary + '\n```\n\n';
            }

            if (overallCoverage) {
              comment += '### Overall Coverage\n\n' + overallCoverage + '\n\n';
            }

            if (coverage) {
              comment += '<details>\n<summary>Coverage Details</summary>\n\n```\n' + coverage + '\n```\n</details>\n\n';
            }

            if (errors) {
              comment += '<details>\n<summary>Error Details</summary>\n\n```\n' + errors + '\n```\n</details>\n';
            }

            core.setOutput('message', comment);

      - uses: marocchino/sticky-pull-request-comment@v3
        id: sticky-comment
        if: always()
        with:
          header: "Test Results"
          message: ${{ steps.set-results.outputs.message }}
          hide_and_recreate: true
          hide_classify: "OUTDATED"

      - name: Fail if tests failed
        if: steps.test.outcome != 'success'
        run: exit 1

  web-build:
    name: Web Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # The web target is a first-class platform here, and it is the one that
      # breaks silently: a native-only API or a sync expo-sqlite call compiles
      # fine and only fails in a browser. Exporting on every PR catches that at
      # review time rather than after a deploy.
      - name: Export web bundle
        run: bun run build:web
